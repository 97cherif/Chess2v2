<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2v2 Chess</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main>
    <h1>♞ 2v2 Chess</h1>
    <div id="lobby">
      <input id="name" placeholder="Your name" maxlength="20">
      <input id="code" placeholder="Room code" maxlength="12">
      <div class="row">
        <button id="create">Create room</button>
        <button id="join">Join room</button>
      </div>
    </div>
    <div id="game" hidden>
      <div id="roomcode"></div>
      <div id="status"></div>
      <div id="board"></div>
      <div id="seats"></div>
    </div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
